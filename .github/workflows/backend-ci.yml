name: Backend CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate database migration
        run: python -m alembic upgrade head
      - name: Run test suite
        run: python -m pytest -q


  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiph
          POSTGRES_PASSWORD: aiph
          POSTGRES_DB: ai_power_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiph -d ai_power_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aiph:aiph@localhost:5432/ai_power_hub_test
      APP_ENV: development
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PostgreSQL dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-postgres.txt
      - name: Upgrade all migrations on PostgreSQL
        run: python -m alembic upgrade head
      - name: Validate downgrade and re-upgrade on PostgreSQL
        run: python -m alembic downgrade base && python -m alembic upgrade head && python -m alembic current
