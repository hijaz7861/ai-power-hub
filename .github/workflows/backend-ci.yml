name: Backend CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate database migration
        run: python -m alembic upgrade head
      - name: Run test suite
        run: python -m pytest -q


  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiph
          POSTGRES_PASSWORD: aiph
          POSTGRES_DB: ai_power_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiph -d ai_power_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aiph:aiph@localhost:5432/ai_power_hub_test
      APP_ENV: development
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PostgreSQL dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-postgres.txt
      - name: Upgrade all migrations on PostgreSQL
        run: python -m alembic upgrade head
      - name: Validate downgrade and re-upgrade on PostgreSQL
        run: python -m alembic downgrade base && python -m alembic upgrade head && python -m alembic current


  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          sed -i 's|^PUBLIC_APP_URL=.*|PUBLIC_APP_URL=https://aiph.example.test|' .env
          docker compose config --quiet
      - name: Build all deployment images
        run: docker compose build --pull
      - name: Start deployment stack and verify health
        run: |
          set -euo pipefail
          sed -i 's|^SECRET_KEY=.*|SECRET_KEY=ci-only-secret-key-0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=abcdef0123456789abcdef0123456789|' .env
          sed -i 's|^PUBLIC_APP_URL=.*|PUBLIC_APP_URL=https://aiph.example.test|' .env
          sed -i 's|^APP_ORIGIN=.*|APP_ORIGIN=https://aiph.example.test|' .env
          docker compose up -d --wait --wait-timeout 180
          curl --fail --show-error --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:3000/health
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read().decode())"
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop deployment stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
